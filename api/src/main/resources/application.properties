spring.application.name=api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/runway
spring.datasource.username=${DB_USERNAME:runway}
spring.datasource.password=${DB_PASSWORD:runway}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

runway.jwt.secret=${RUNWAY_JWT_SECRET:dev-only-secret-please-override-in-prod-min-32-bytes}
runway.jwt.expiration-minutes=${RUNWAY_JWT_EXPIRATION_MINUTES:10080}
